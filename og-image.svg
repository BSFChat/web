<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Source for og-image.png (the social-preview card). Edit this, then
       re-export the PNG at 1200x630; see README "Social preview image". -->
  <rect width="1200" height="630" fill="#1e1f22"/>
  <rect x="0" y="0" width="1200" height="8" fill="#5865f2"/>
  <rect x="96" y="120" width="128" height="128" rx="28" ry="28" fill="#5865f2"/>
  <text x="160" y="184" text-anchor="middle" dominant-baseline="central"
        font-family="Geist, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="80" font-weight="700" fill="#ffffff">B</text>
  <text x="256" y="184" dominant-baseline="central"
        font-family="Geist, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="72" font-weight="700" fill="#f2f3f5">BSFChat</text>
  <text x="96" y="370"
        font-family="Geist, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="58" font-weight="700" fill="#f2f3f5">Self-hosted chat you actually own.</text>
  <text x="96" y="450"
        font-family="Geist, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="36" font-weight="400" fill="#b5bac1">Channels, roles and voice. No tracking, no ads, no lock-in.</text>
  <text x="96" y="550"
        font-family="Geist, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="30" font-weight="600" fill="#5865f2">bsfchat.com</text>
</svg>
